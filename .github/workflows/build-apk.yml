
name: Build Randomizer APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        run: |
          wget https://services.gradle.org/distributions/gradle-8.9-bin.zip
          sudo unzip -q gradle-8.9-bin.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Extract project
        run: unzip -q RandomizerAndroid-cloud-build.zip

      - name: Build APK
        working-directory: RandomizerAndroid
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Randomizer-debug-apk
          path: RandomizerAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
